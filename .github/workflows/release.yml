name: Release

# Builds the installers for Linux (.deb, .rpm, AppImage) and Windows (.exe,
# .msi).
# Push a version tag (e.g. v0.1.0) to attach them to a draft GitHub release,
# or run the workflow by hand from the Actions tab to get them as artifacts.
#
# The installers are signed for Cadenza's updates, with the private key in
# the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# secrets (the public key is in src-tauri/tauri.conf.json). The release also
# gets latest.json, which installed copies read to find the new version once
# the draft is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Runs for the same tag wait for each other instead of writing latest.json
# at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag must match the app's version (or the installers would carry
  # another version than the release) and have release notes. Runs on a
  # branch only build artifacts, so they only need the two versions to agree.
  version:
    # Pinned like checks.yml (this job needs only Python and jq).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        run: |
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$cargo" != "$tauri" ]; then
            echo "::error::src-tauri/Cargo.toml has version $cargo but src-tauri/tauri.conf.json has $tauri."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::notice::Not a tag: building $cargo as workflow artifacts, without a release."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $cargo in src-tauri/Cargo.toml and tauri.conf.json."
            exit 1
          fi
          if ! awk -v v="$version" '/^## / && $2 == v { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section for the release notes."
            exit 1
          fi
          echo "Releasing $version."

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates can't be signed (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # GStreamer plugins that the AppImage bundles so video and audio play.
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      # Pinned to v1 (on the action's master branch), which takes the
      # toolchain as an input; @stable would pick it from the ref instead.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The release page shows this version's section of CHANGELOG.md.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<CADENZA_RELEASE_NOTES'
            awk -v v="$version" '/^## / { p = ($2 == v); next } p' CHANGELOG.md
            echo 'Installers for Linux and Windows are attached below.'
            echo 'CADENZA_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          # Signed installers, and latest.json for the updates.
          args: --config src-tauri/tauri.updater.conf.json
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Cadenza ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true

      - name: Keep installers as workflow artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cadenza-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  # Both builds add their installers to latest.json. Should they have
  # finished at the same moment, one may have overwritten the other's. Every
  # installer needs a download URL and a signature, or updates to it fail.
  check-updates:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          for target in linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage windows-x86_64-nsis windows-x86_64-msi; do
            if ! jq -e --arg t "$target" '.platforms[$t] | (.signature | length > 0) and (.url | length > 0)' latest.json > /dev/null; then
              echo "::error::latest.json lacks the $target installer or its URL or signature: re-run all jobs of this workflow run."
              exit 1
            fi
          done
          echo "latest.json lists every installer."
