name: Release

# Builds the installers for Linux (.deb, .rpm, AppImage) and Windows (.exe,
# .msi).
# Push a version tag (e.g. v0.1.0) to attach them to a draft GitHub release,
# or run the workflow by hand from the Actions tab to get them as artifacts.
#
# The installers are signed for Cadenza's updates, with the private key in
# the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# secrets (the public key is in src-tauri/tauri.conf.json). The release also
# gets latest.json, which installed copies read to find the new version once
# the draft is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates can't be signed (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # GStreamer plugins that the AppImage bundles so video and audio play.
          sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The release page shows this version's section of CHANGELOG.md.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'body<<CADENZA_RELEASE_NOTES'
            awk -v v="$version" '/^## / { p = ($2 == v); next } p' CHANGELOG.md
            echo 'Installers for Linux and Windows are attached below.'
            echo 'CADENZA_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2.12.1
          # Signed installers, and latest.json for the updates.
          args: --config src-tauri/tauri.updater.conf.json
          updaterJsonPreferNsis: true
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Cadenza ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true

      - name: Keep installers as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cadenza-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  # Both builds add their installers to latest.json. Should they have
  # finished at the same moment, one may have overwritten the other's.
  check-updates:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          for target in linux-x86_64-deb linux-x86_64-rpm linux-x86_64-appimage windows-x86_64-nsis windows-x86_64-msi; do
            if ! jq -e --arg t "$target" '.platforms[$t].signature' latest.json > /dev/null; then
              echo "::error::latest.json has no $target installer: re-run all jobs of this workflow run."
              exit 1
            fi
          done
          echo "latest.json lists every installer."
