name: Checks

# Runs the checks CONTRIBUTING.md asks for before a pull request: Rust
# formatting, Clippy (warnings fail) and unit tests, the UI module checks and
# tests, and the translation catalogs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # The Ubuntu release Cadenza is developed on. A newer one comes in when
    # this is changed, not when GitHub moves ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GTK and WebKitGTK crates' build scripts need these.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      # Pinned to v1 (on the action's master branch), which takes the
      # toolchain as an input; @stable would pick it from the ref instead.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: UI modules
        run: node tools/check_js.cjs

      - name: UI tests
        run: node --experimental-vm-modules tools/test_ui.cjs

      # Strings not translated yet show in English, so they don't fail it.
      - name: Translations
        run: python3 tools/i18n.py check --allow-missing
