name: CodeQL

# Scans Cadenza's Rust and JavaScript, and these workflows, for security
# problems; results are under Security → Code scanning. The libraries in
# ui/vendor are skipped (see .github/codeql/codeql-config.yml).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to pick up new CodeQL queries even when nothing is pushed.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Pinned, as in checks.yml.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The GTK and WebKitGTK crates' build scripts look these up while
      # CodeQL reads the Rust code.
      - name: Install Linux dependencies
        if: matrix.language == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
