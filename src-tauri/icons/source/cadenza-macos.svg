<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Cadenza logo on Apple's icon grid: an 824 px body centered on a
       1024 px canvas, with the standard soft shadow. -->
  <defs>
    <linearGradient id="czg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff" />
      <stop offset="1" stop-color="#e2489f" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dy="10" />
      <feComponentTransfer><feFuncA type="linear" slope="0.3" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#czg)" filter="url(#shadow)" />
  <g transform="translate(72.533 72.533) scale(13.7333)">
    <path d="M42.5 21.5a15 15 0 1 0 0 21" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="44.5" cy="19.5" r="4.6" fill="#fff" />
  </g>
</svg>
