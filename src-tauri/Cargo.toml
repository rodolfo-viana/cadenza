[package]
name = "cadenza"
version = "0.3.2"
description = "Cadenza — a presentation studio built on reveal.js"
authors = ["Rodolfo Viana"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
default-run = "cadenza"

[lib]
name = "cadenza_lib"
path = "src/lib.rs"

[[bin]]
name = "cadenza"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-clipboard-manager = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
ammonia = "4"
sha2 = "0.11"
hex = "0.4"
imagesize = "0.15"
fontdb = "0.24"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
base64 = "0.23"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
mime_guess = "2"
ureq = "3"
keyring = "4"

# Fine-grained WebKitGTK settings for the media browser window, and the
# page setup for printing (same versions as Tauri's webview layer).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
gtk = "0.18"

# Saving PDFs with WebView2's own printing, and giving the focus back from
# the media browser (same versions as Tauri's webview layer).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

# Keeps the audience window drawing while it is behind the presenter display.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
