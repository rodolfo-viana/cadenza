function mergeDocumentPatch(target, patch) {
  for (const [key, value] of Object.entries(patch)) {
    if (key === '__proto__' || key === 'constructor' || key === 'prototype') {
      throw new Error('Unsafe document patch key: ' + key);
    }
    if (value && typeof value === 'object' && !Array.isArray(value)) {
      if (!Object.hasOwn(target, key) || !target[key] || typeof target[key] !== 'object' || Array.isArray(target[key])) target[key] = {};
      mergeDocumentPatch(target[key], value);
    } else target[key] = value;
  }
}

await test('native transport stub rejects prototype keys at every depth',()=>{
  for (const key of ['__proto__','constructor','prototype']) {
    for (const nested of [false,true]) {
      const unsafe=JSON.parse(`{"${key}":{"polluted":true}}`);
      const target={content:{}};
      let rejected=false;
      try { mergeDocumentPatch(target,nested ? {content:unsafe} : unsafe); } catch { rejected=true; }
      assert(rejected, 'Accepted unsafe key: ' + key);
      equal(Object.getPrototypeOf(target),Object.prototype);
      assert(!Object.hasOwn(target,key)); assert(!Object.hasOwn(target.content,key));
      assert(!Object.hasOwn(Object.prototype,'polluted'));
    }
  }
  const target=Object.create({content:{text:'inherited'}});
  mergeDocumentPatch(target,{content:{text:'own'}});
  equal(target.content.text,'own'); equal(Object.getPrototypeOf(target).content.text,'inherited');
});
