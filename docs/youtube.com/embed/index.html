<!doctype html>
<!--
  Plays a YouTube video in presentations exported by Cadenza and opened from
  disk (file://). YouTube refuses to play embeds whose request names no
  embedding page (error 153), and pages opened from disk send none. Embedded
  from here, the player sees this page instead. reveal.js's play/pause
  messages are passed on to the player.

  Usage: youtube.com/embed/?v=VIDEO_ID&rel=0&enablejsapi=1 (the path keeps
  the `youtube.com/embed/` that reveal.js looks for).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube video · Cadenza</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('v') || '';
    if (!/^[\w-]{1,32}$/.test(id)) return;
    // Only the player options Cadenza uses, with URL-safe values.
    var options = ['rel', 'enablejsapi', 'mute', 'loop', 'playlist', 'controls'];
    var query = [];
    options.forEach(function (k) {
      var v = params.get(k);
      if (v !== null && /^[\w-]{0,64}$/.test(v)) query.push(k + '=' + v);
    });
    var player = document.createElement('iframe');
    player.src = 'https://www.youtube.com/embed/' + id + (query.length ? '?' + query.join('&') : '');
    player.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    player.allowFullscreen = true;
    document.body.appendChild(player);
    addEventListener('message', function (e) {
      if (e.source === parent) player.contentWindow.postMessage(e.data, 'https://www.youtube.com');
      else if (e.source === player.contentWindow) parent.postMessage(e.data, '*');
    });
  })();
</script>
</body>
</html>
